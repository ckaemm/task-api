name: CI

on:
  push:
    branches: [ "feature/task-api" ]
  pull_request:
    branches: [ "feature/task-api" ]

env:
  # github.repository = "ckaemm/task-api" -> ghcr.io/ckaemm/task-api
  # GHCR image adlari kucuk harf olmak zorundadir; owner adi zaten kucuk harf.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build, Test & Docker Image (Java 21)
    runs-on: ubuntu-latest

    # DIKKAT: permissions blogu yazildigi anda burada listelenmeyen TUM izinler
    # "none" olur. Bu yuzden checkout'un ihtiyaci olan contents: read de acikca
    # yazilmak zorunda; sadece packages: write yazarsak checkout kirilir.
    permissions:
      contents: read      # actions/checkout icin
      packages: write     # GHCR'a push icin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # package fazi lifecycle'da test fazindan sonra gelir; tek komut
      # once testleri calistirir, sonra Spring Boot JAR'ini uretir.
      - name: Build and test
        run: ./mvnw -B clean package

      # Runner'da Docker daemon hazir gelir (Docker 28.x, ubuntu-24.04 image'i),
      # bu yuzden ayrica kurulum adimi gerekmez.
      # Bu adim package'dan SONRA gelmeli: Dockerfile target/*.jar bekliyor.
      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" .

      - name: Show image
        run: docker image ls "$IMAGE_NAME"

      # Login ve push yalnizca push olayinda calisir:
      #  - Fork'lardan gelen PR'larda GITHUB_TOKEN zorla salt-okunurdur.
      #  - PR'da github.sha, gercek bir commit degil, gecici merge commit'idir.
      # PR'lar yine de Docker build adimindan gecer; sadece yayinlanmaz.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: docker push "$IMAGE_NAME:${{ github.sha }}"
