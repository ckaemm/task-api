name: CI

on:
  push:
    branches: [ "feature/task-api" ]
  pull_request:
    branches: [ "feature/task-api" ]

jobs:
  test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # package fazi lifecycle'da test fazindan sonra gelir; tek komut
      # once testleri calistirir, sonra Spring Boot JAR'ini uretir.
      - name: Build and test
        run: ./mvnw -B clean package
