name: CI

on:
  push:
    branches: [ "feature/task-api" ]
  pull_request:
    branches: [ "feature/task-api" ]

env:
  # github.repository = "ckaemm/task-api" -> ghcr.io/ckaemm/task-api
  # GHCR image adlari kucuk harf olmak zorundadir; owner adi zaten kucuk harf.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Build, Test & Docker Image (Java 21)
    runs-on: ubuntu-latest

    # DIKKAT: permissions blogu yazildigi anda burada listelenmeyen TUM izinler
    # "none" olur. Bu yuzden checkout'un ihtiyaci olan contents: read de acikca
    # yazilmak zorunda; sadece packages: write yazarsak checkout kirilir.
    permissions:
      contents: read      # actions/checkout icin
      packages: write     # GHCR'a push icin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # package fazi lifecycle'da test fazindan sonra gelir; tek komut
      # once testleri calistirir, sonra Spring Boot JAR'ini uretir.
      - name: Build and test
        run: ./mvnw -B clean package

      # Varsayilan "docker" driver'i multi-platform cikti veremez; bu adim
      # manifest list uretebilen docker-container driver'li bir builder kurar.
      # QEMU gerekmiyor: Dockerfile'da RUN yok, yalnizca COPY var ve JAR
      # platform bagimsiz. Emule edilecek bir komut bulunmuyor.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push, build ile ayni adimda gerceklestigi icin login ONCE gelmeli.
      # Fork'lardan gelen PR'larda GITHUB_TOKEN zorla salt-okunurdur ve
      # PR'da github.sha gercek bir commit degil, gecici merge commit'idir.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context: . ZORUNLU. Aksi halde action varsayilan olarak Git context
      # kullanir; orada target/ dizini yoktur (JAR git'te izlenmiyor) ve
      # COPY target/*.jar "not found" ile kirilir.
      #
      # push yalnizca push olayinda true olur; PR'lar build edilir, yayinlanmaz.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Multi-platform sonuc yerel image deposuna yuklenemez, bu yuzden
      # "docker image ls" yerine registry'deki manifest list'i okuyoruz.
      # Bu, iki platformun da gercekten yayinlandigini dogrular.
      - name: Inspect pushed image
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect "$IMAGE_NAME:${{ github.sha }}"
